<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>StudentMedical · Anatomía con IA</title>
<meta name="description" content="Estudia medicina con un tutor de IA: anatomía en español, portugués e inglés.">
<meta name="theme-color" content="#0f1b2d">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;700;800&display=swap">
<style>
:root{
  --bg:#eef2f6; --panel:#ffffff; --ink:#0f1b2d; --muted:#5b6778; --line:#dbe2ea;
  --univ:#7a1f2e; --univ-ink:#ffffff; --ok:#1e8a4c; --bad:#c0392b;
  --stage1:#dfe7f0; --stage2:#c7d3e0;
  --font:"Nunito Sans","Segoe UI",Roboto,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.45}
button{font:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--univ);outline-offset:2px}

header{display:flex;align-items:center;gap:12px;padding:10px 16px;background:var(--ink);color:#fff;position:sticky;top:0;z-index:5}
.marca{display:flex;align-items:center;gap:10px;font-weight:800;font-size:18px;letter-spacing:.2px}
.marca .cruz{width:30px;height:30px;border-radius:8px;background:var(--univ);display:grid;place-items:center}
.marca small{display:block;font-weight:600;font-size:12px;opacity:.75}
.espaco{flex:1}
.idiomas{display:flex;background:rgba(255,255,255,.1);border-radius:999px;padding:3px}
.idiomas button{border:0;background:transparent;color:#fff;font-weight:700;padding:6px 12px;border-radius:999px;min-height:36px}
.idiomas button[aria-pressed="true"]{background:#fff;color:var(--ink)}
.xp{font-weight:700;font-size:14px;background:rgba(255,255,255,.1);padding:7px 12px;border-radius:999px;white-space:nowrap}

main{display:grid;grid-template-columns:minmax(340px,56%) 1fr;height:calc(100vh - 56px);height:calc(100dvh - 56px)}
.palco{position:relative;background:radial-gradient(ellipse at 50% 35%,var(--stage1),var(--stage2));overflow:hidden}
.atlas{position:absolute;inset:0;display:none}
.palco[data-modo="atlas"] .atlas{display:block}
.prof{position:absolute;inset:0;transition:all .35s ease;z-index:2}
.palco[data-modo="atlas"] .prof{inset:auto auto 14px 14px;width:clamp(170px,30%,280px);height:clamp(210px,42%,360px);border-radius:18px;overflow:hidden;
  background:linear-gradient(180deg,#2b3532,#141a18);box-shadow:0 10px 30px rgba(15,27,45,.35);border:2px solid #fff}
.prof-status{position:absolute;left:0;right:0;top:45%;text-align:center;font-weight:700;color:var(--muted);z-index:1;pointer-events:none}
.palco[data-modo="atlas"] .prof-status{color:#cfd8d4}
.barra-atlas{position:absolute;left:14px;right:14px;top:12px;display:none;justify-content:space-between;align-items:flex-start;gap:10px;z-index:3}
.palco[data-modo="atlas"] .barra-atlas{display:flex}
.peca{background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px 12px;font-weight:700;box-shadow:0 4px 14px rgba(15,27,45,.1);max-width:55%}
.peca:empty{display:none}
.controles{display:flex;gap:8px;align-items:center;margin-left:auto;background:rgba(255,255,255,.9);border:1px solid var(--line);border-radius:12px;padding:6px 10px}
.deslizar{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700}
.deslizar input{width:120px;accent-color:var(--univ)}
.btn.mini{min-height:34px;padding:5px 10px;font-size:13px}
.credito{position:absolute;right:12px;bottom:8px;font-size:11px;color:var(--muted);display:none;z-index:3}
.palco[data-modo="atlas"] .credito{display:block}
.balao{position:absolute;left:16px;right:16px;bottom:72px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px 14px;
  box-shadow:0 6px 20px rgba(15,27,45,.12);font-weight:600;max-height:30%;overflow:auto;z-index:4}
.palco[data-modo="atlas"] .balao{left:calc(14px + clamp(170px,30%,280px) + 12px);bottom:14px;max-height:40%}
.balao[hidden]{display:none}
.comecar{position:absolute;left:50%;bottom:150px;transform:translateX(-50%);z-index:5;border:0;border-radius:999px;background:var(--univ);color:#fff;font:inherit;font-weight:800;padding:14px 24px;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.comecar[hidden]{display:none}
.dica-girar{position:absolute;left:0;right:0;bottom:44px;text-align:center;font-size:13px;color:var(--muted);display:none}
.palco[data-modo="atlas"] .dica-girar{display:block;left:auto;right:12px;bottom:26px}
.acoes-palco{position:absolute;right:14px;bottom:14px;z-index:4}
.palco[data-modo="atlas"] .acoes-palco{display:none}
.btn{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:12px;padding:9px 14px;font-weight:700;min-height:44px;display:inline-flex;align-items:center;gap:8px}
.btn.prim{background:var(--univ);border-color:var(--univ);color:var(--univ-ink)}
.btn:disabled{opacity:.5;cursor:default}

.painel{overflow:auto;padding:18px 20px 40px;background:var(--panel)}
h2{font-size:20px;margin:6px 0 12px}
h3{font-size:15px;margin:18px 0 8px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px}
.materias{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 12px;font-weight:700;display:inline-flex;gap:6px;align-items:center;min-height:40px}
.chip[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.chip .breve{font-size:11px;font-weight:700;color:var(--muted);background:var(--bg);border-radius:999px;padding:1px 7px}
.chip:disabled{cursor:default;opacity:.7}
.temas{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.tema{border:1px solid var(--line);background:#fff;border-radius:16px;padding:14px;text-align:left;display:flex;flex-direction:column;gap:6px;min-height:104px;transition:transform .15s,box-shadow .15s}
.tema:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(15,27,45,.08)}
.tema .ic{font-size:28px}
.tema b{font-size:15px}
.tema .feito{font-size:12px;color:var(--ok);font-weight:700}

.abas{display:flex;gap:6px;border-bottom:1px solid var(--line);margin:8px 0 14px}
.abas button{border:0;background:none;padding:10px 12px;font-weight:700;color:var(--muted);border-bottom:3px solid transparent;min-height:44px}
.abas button[aria-selected="true"]{color:var(--ink);border-color:var(--univ)}
.pontos{margin:0;padding:0;list-style:none;counter-reset:p}
.pontos li{counter-increment:p;position:relative;padding:12px 12px 12px 48px;border:1px solid var(--line);border-radius:14px;margin-bottom:8px;transition:background .2s}
.pontos li::before{content:counter(p);position:absolute;left:12px;top:12px;width:26px;height:26px;border-radius:50%;background:var(--bg);display:grid;place-items:center;font-weight:800;font-size:13px}
.pontos li.atual{background:#fff7e6;border-color:#f0c36d}
.livros{font-size:14px;color:var(--muted);margin-top:12px}
.livros li{margin:2px 0}
.linha-botoes{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}

.pergunta{font-weight:800;font-size:18px;margin:4px 0 12px}
.opcoes{display:grid;gap:8px}
.opcao{text-align:left;border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:12px 14px;font-weight:600;min-height:48px}
.opcao:disabled{color:var(--ink);cursor:default}
.opcao.certa{border-color:var(--ok);background:#eaf7ef}
.opcao.errada{border-color:var(--bad);background:#fdeeee}
.explica{margin-top:12px;padding:12px;border-radius:12px;background:var(--bg)}
.progresso{font-size:13px;color:var(--muted);font-weight:700}

.chat{display:flex;flex-direction:column;gap:8px;min-height:160px;margin-bottom:12px}
.msg{max-width:88%;padding:10px 12px;border-radius:14px}
.msg.eu{align-self:flex-end;background:var(--ink);color:#fff;border-bottom-right-radius:4px}
.msg.ia{align-self:flex-start;background:var(--bg);border-bottom-left-radius:4px}
.msg .fontes{font-size:12px;color:var(--muted);margin-top:6px}
.aviso{font-size:13px;color:var(--muted);background:var(--bg);border-radius:10px;padding:8px 10px;margin-bottom:10px}
form.perg{display:flex;gap:8px}
form.perg input{flex:1;font:inherit;border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-height:46px}

/* configurar estudante */
.campo{margin-bottom:14px}
.campo>span{display:block;font-weight:700;font-size:14px;margin-bottom:6px}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.univ{border:1.5px solid var(--line);background:#fff;border-radius:14px;padding:10px 12px;display:flex;align-items:center;gap:10px;text-align:left;flex:1 1 180px;min-height:56px}
.univ[aria-pressed="true"],.opt[aria-pressed="true"]{border-color:var(--ink);box-shadow:0 0 0 2px var(--ink) inset}
.univ .cor{width:26px;height:26px;border-radius:8px;flex:none}
.univ small{display:block;color:var(--muted);font-size:12px}
.opt{border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:8px 14px;font-weight:700;min-height:44px}
.cor-btn{width:40px;height:40px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px var(--line)}
.cor-btn[aria-pressed="true"]{box-shadow:0 0 0 3px var(--ink)}
.campo input[type=text]{width:100%;font:inherit;border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-height:46px}
[hidden]{display:none!important}

@media (max-width:820px){
  main{grid-template-columns:1fr;grid-template-rows:50vh auto;height:auto}
  .palco{height:50vh;position:sticky;top:56px;z-index:2}
  .painel{padding:16px}
  .marca small{display:none}
  .xp{display:none}
  .palco[data-modo="atlas"] .prof{width:36%;height:52%;left:8px;bottom:8px}
  .palco[data-modo="atlas"] .balao{left:calc(36% + 16px);right:8px;bottom:8px;font-size:13px;padding:8px 10px;max-height:52%}
  .palco[data-modo="atlas"] .dica-girar,.palco[data-modo="atlas"] .credito{display:none}
  .deslizar span{display:none}
  .deslizar input{width:90px}
  .balao{bottom:66px;font-size:14px;padding:9px 12px}
}
@media (prefers-reduced-motion:reduce){.tema{transition:none}}
</style>
</head>
<body>
<header>
  <div class="marca">
    <div class="cruz" aria-hidden="true"><svg width="18" height="18" viewBox="0 0 24 24" fill="#fff"><path d="M9 2h6v7h7v6h-7v7H9v-7H2V9h7z"/></svg></div>
    <div>StudentMedical<small id="lema"></small></div>
  </div>
  <div class="espaco"></div>
  <div class="xp" id="xp"></div>
  <div class="idiomas" role="group" aria-label="Idioma">
    <button type="button" data-lang="es">ES</button>
    <button type="button" data-lang="pt">PT</button>
    <button type="button" data-lang="en">EN</button>
  </div>
</header>

<main>
  <section class="palco" id="palco" data-modo="avatar" aria-label="Estudiante 3D">
    <div id="atlas" class="atlas" aria-label="Atlas 3D"></div>
    <div class="barra-atlas" id="barraAtlas">
      <span class="peca" id="peca" aria-live="polite"></span>
      <div class="controles">
        <label class="deslizar"><span id="rotExplodir"></span><input type="range" id="explodir" min="0" max="100" value="0"></label>
        <button type="button" class="btn mini" id="btnCentro"></button>
      </div>
    </div>
    <div class="dica-girar" id="dicaGirar"></div>
    <div class="credito" id="credito"></div>
    <div id="prof" class="prof"><div class="prof-status" id="profStatus"></div></div>
    <div class="balao" id="balao" aria-live="polite" hidden></div>
    <button type="button" class="comecar" id="btnComecar" hidden></button>
    <div class="acoes-palco"><button type="button" class="btn" id="btnTrocar"></button></div>
  </section>

  <section class="painel" id="painel"></section>
</main>

<script type="importmap">
{ "imports": { "three": "./js/vendor/three.module.js", "three/addons/": "./js/vendor/addons/" } }
</script>
<script type="module" src="./js/app.js"></script>
</body>
</html>
